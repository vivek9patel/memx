[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memx-eval"
version = "0.1.1"
description = "Vendor-agnostic harness for evaluating memory systems, with failure diagnostics."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Vivek Patel" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "litellm>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]
streaming = [
    "ijson>=3.2",
]
mem0 = [
    "mem0ai>=0.1",
]
supermemory = [
    "supermemory>=3.0",
]
providers = [
    "mem0ai>=0.1",
    "supermemory>=3.0",
]

[project.urls]
Homepage = "https://github.com/vivek9patel/memx"
Issues = "https://github.com/vivek9patel/memx/issues"

[project.scripts]
memx = "memx.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/memx"]

[tool.hatch.build.targets.wheel.sources]
"src/memx" = "memx"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
